apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
      component: frontend
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
        component: frontend
    spec:
      containers:
      - name: {{ .Values.frontend.containerName }}
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.frontend.service.port }}
        livenessProbe:
          httpGet:
            path: {{ .Values.frontend.livenessProbe.path }}
            port: {{ .Values.frontend.service.port }}
          initialDelaySeconds: 15   
          periodSeconds: 20        
        readinessProbe:
          httpGet:
            path: {{ .Values.frontend.readinessProbe.path }}
            port: {{ .Values.frontend.service.port }}
          initialDelaySeconds: 10   
          periodSeconds: 5
        volumeMounts:
        - name: nginx-conf
          mountPath:  /etc/nginx/conf.d/nginx.conf
          subPath: nginx.conf                 
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
            items:
              - key: nginx.conf
                path: nginx.conf